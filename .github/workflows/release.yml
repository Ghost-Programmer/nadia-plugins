name: Build, Version & Release Nadia Plugins

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic version part to increment'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      custom_version:
        description: 'Optional explicit version (e.g. 1.2.0); overrides bump when set'
        required: false
        default: ''
        type: string
      run_tests:
        description: 'Run automated JUnit test suite prior to packaging'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: nadia-plugins-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Increment Version, Build & Publish Plugin Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip ci]') &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Calculate next version
        id: version
        env:
          INPUT_BUMP: ${{ inputs.bump || 'patch' }}
          INPUT_CUSTOM_VERSION: ${{ inputs.custom_version || '' }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          CURRENT_VERSION=$(grep -E '^pluginsVersion=' gradle.properties | head -n1 | cut -d'=' -f2- | tr -d '[:space:]')
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION="1.0.0"
          fi

          bump_semver() {
            local ver="$1"
            local mode="$2"
            IFS='.' read -r major minor patch _rest <<< "${ver%%-*}"
            major=${major:-1}
            minor=${minor:-0}
            patch=${patch:-0}
            case "$mode" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              none)
                ;;
            esac
            echo "${major}.${minor}.${patch}"
          }

          if [ -n "$INPUT_CUSTOM_VERSION" ]; then
            NEW_VERSION="$INPUT_CUSTOM_VERSION"
          else
            NEW_VERSION=$(bump_semver "$CURRENT_VERSION" "$INPUT_BUMP")
            if [ "$INPUT_BUMP" != "none" ]; then
              while git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; do
                NEW_VERSION=$(bump_semver "$NEW_VERSION" "patch")
              done
            fi
          fi

          TAG_NAME="v${NEW_VERSION}"
          echo "Previous plugins version: ${CURRENT_VERSION}"
          echo "Next plugins version:     ${NEW_VERSION} (${TAG_NAME})"

          {
            echo "prev_version=${CURRENT_VERSION}"
            echo "new_version=${NEW_VERSION}"
            echo "tag_name=${TAG_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and test PF4J plugin JARs
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          RUN_TESTS: ${{ inputs.run_tests == false && 'false' || 'true' }}
        run: |
          set -euo pipefail
          chmod +x ./build.sh ./gradlew

          BUILD_FLAGS=(--set-version "$NEW_VERSION" --no-daemon)
          if [ "$RUN_TESTS" = "true" ]; then
            BUILD_FLAGS=(--with-tests "${BUILD_FLAGS[@]}")
          fi

          ./build.sh "${BUILD_FLAGS[@]}"

          shopt -s nullglob
          JARS=(dist/*.jar)
          shopt -u nullglob
          if [ "${#JARS[@]}" -eq 0 ]; then
            echo "ERROR: No plugin JARs were produced in dist/."
            exit 1
          fi
          ls -lh dist/

      - name: Commit incremented version and push tag
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet gradle.properties; then
            git add gradle.properties
            git commit -m "chore(release): ${TAG_NAME} [skip ci]"
            # Discard any incidental filemode changes (e.g. chmod +x on build.sh/gradlew) before rebasing
            git checkout -- .
            git pull --rebase --autostash origin "${BRANCH_NAME}"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

          git tag -fa "${TAG_NAME}" -m "Nadia Plugins ${TAG_NAME}"
          git push origin "${TAG_NAME}" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Nadia Plugins ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          body: |
            ### Nadia PF4J Plugins ${{ steps.version.outputs.tag_name }}
            Install any attached `.jar` into `~/.nadia/plugins/` or directly inside Nadia via **System Settings → Plugins**.
          files: |
            dist/*.jar

