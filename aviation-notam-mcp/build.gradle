description = 'FAA Airport Delays, NOTAM Search & Military ADS-B Flight Tracking MCP Tool PF4J plugin for Nadia.'

dependencies {
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
}

tasks.named('jar') {
    archiveBaseName = 'aviation-notam-mcp'
    manifest {
        attributes(
            'Plugin-Id': 'aviation-notam-mcp',
            'Plugin-Version': project.version.toString(),
            'Plugin-Provider': 'Miller Software Solutions LLC',
            'Plugin-Description': project.description,
            'Plugin-License': 'Apache-2.0',
            'Plugin-Class': 'com.nadia.plugin.aviation.AviationNotamPlugin'
        )
    }
}
