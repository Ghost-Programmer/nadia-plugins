plugins {
    id 'org.openjfx.javafxplugin' version '0.1.0' apply false
}

def rootPluginsVersion = providers.gradleProperty('pluginsVersion').getOrElse('1.0.0')
def hostPluginApiVersion = providers.gradleProperty('pluginApiVersion').getOrElse('1.0.0')
def cliPluginsVersionOverride = providers.gradleProperty('pluginsVersionOverride')

allprojects {
    group = 'com.nadia.plugins'
    version = cliPluginsVersionOverride.getOrElse(rootPluginsVersion)

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = uri('https://repo.spring.io/milestone') }
    }
}

subprojects { subproject ->
    apply plugin: 'java'

    def perPluginVersion = providers.gradleProperty("${subproject.name}.version")
    subproject.version = cliPluginsVersionOverride
            .orElse(perPluginVersion)
            .orElse(providers.gradleProperty('pluginsVersion'))
            .getOrElse('1.0.0')

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 23
        options.compilerArgs += ['-parameters']
    }

    configurations {
        testImplementation.extendsFrom compileOnly
    }

    dependencies {
        compileOnly platform('org.springframework.ai:spring-ai-bom:1.0.0-M6')
        compileOnly "com.nadia:nadia-plugin-api:${hostPluginApiVersion}"
        annotationProcessor 'org.pf4j:pf4j:3.12.0'

        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testImplementation 'org.mockito:mockito-core:5.23.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
    }

    tasks.named('test') {
        useJUnitPlatform()
        jvmArgs += [
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--enable-native-access=ALL-UNNAMED'
        ]
    }

    tasks.register('installPlugin', Copy) {
        group = 'nadia'
        description = 'Builds and installs this PF4J plugin JAR into ~/.nadia/plugins/, removing older versions of the same plugin.'
        def jarTask = tasks.named('jar', Jar)
        def targetPluginsDir = file("${System.getProperty('user.home')}/.nadia/plugins")
        dependsOn jarTask
        from(jarTask)
        into(targetPluginsDir)
        doFirst {
            def baseName = jarTask.get().archiveBaseName.get()
            def currentFileName = jarTask.get().archiveFileName.get()
            if (targetPluginsDir.isDirectory()) {
                targetPluginsDir.listFiles()?.each { existing ->
                    if (existing.isFile()
                            && existing.name.startsWith("${baseName}-")
                            && existing.name.endsWith('.jar')
                            && existing.name != currentFileName) {
                        logger.lifecycle("[installPlugin] Removing older plugin archive: ${existing.name}")
                        existing.delete()
                    }
                }
            }
        }
    }
}

tasks.register('cleanDist', Delete) {
    group = 'nadia'
    description = 'Removes packaged plugin JARs from dist/.'
    delete layout.projectDirectory.dir('dist')
}

tasks.register('packagePlugins', Sync) {
    group = 'nadia'
    description = 'Builds all PF4J plugin subprojects and collects final versioned plugin JARs into dist/.'
    dependsOn subprojects.collect { it.tasks.named('jar') }
    from(subprojects.collect { it.tasks.named('jar') })
    into(layout.projectDirectory.dir('dist'))
}
