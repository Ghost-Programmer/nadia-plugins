description = 'Cloudflare Radar API (Outages, Traffic Anomalies, L3/L7 Attacks, BGP Events) MCP Tool PF4J plugin for Nadia.'

dependencies {
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
}

tasks.named('jar') {
    archiveBaseName = 'cloudflare-radar-mcp'
    manifest {
        attributes(
            'Plugin-Id': 'cloudflare-radar-mcp',
            'Plugin-Version': project.version.toString(),
            'Plugin-Provider': 'Miller Software Solutions LLC',
            'Plugin-Description': project.description,
            'Plugin-License': 'Apache-2.0',
            'Plugin-Class': 'com.nadia.plugin.cloudflare.CloudflareRadarPlugin'
        )
    }
}
