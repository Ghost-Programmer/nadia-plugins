description = 'U.S. EIA Energy Data, GIE AGSI+ EU Gas Storage & ENTSO-E Grid Load MCP Tool PF4J plugin for Nadia.'

dependencies {
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
}

tasks.named('jar') {
    archiveBaseName = 'energy-grid-mcp'
    manifest {
        attributes(
            'Plugin-Id': 'energy-grid-mcp',
            'Plugin-Version': project.version.toString(),
            'Plugin-Provider': 'Miller Software Solutions LLC',
            'Plugin-Description': project.description,
            'Plugin-License': 'Apache-2.0',
            'Plugin-Class': 'com.nadia.plugin.energy.EnergyGridPlugin'
        )
    }
}
