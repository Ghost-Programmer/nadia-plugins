description = 'English (UK) [en-GB] British English UI and AI Language Pack PF4J plugin for Nadia.'

tasks.named('jar') {
    archiveBaseName = 'lang-en-gb'
    manifest {
        attributes(
            'Plugin-Id': 'lang-en-gb',
            'Plugin-Version': project.version.toString(),
            'Plugin-Provider': 'Miller Software Solutions LLC',
            'Plugin-Description': project.description,
            'Plugin-License': 'Apache-2.0',
            'Plugin-Class': 'com.nadia.plugin.lang.engb.EnglishUkLanguagePlugin'
        )
    }
}

