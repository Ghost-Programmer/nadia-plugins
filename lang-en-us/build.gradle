description = 'English (US) [en-US] UI and AI Language Pack PF4J plugin for Nadia.'

tasks.named('jar') {
    archiveBaseName = 'lang-en-us'
    manifest {
        attributes(
            'Plugin-Id': 'lang-en-us',
            'Plugin-Version': project.version.toString(),
            'Plugin-Provider': 'Miller Software Solutions LLC',
            'Plugin-Description': project.description,
            'Plugin-License': 'Apache-2.0',
            'Plugin-Class': 'com.nadia.plugin.lang.enus.EnglishUsLanguagePlugin'
        )
    }
}

