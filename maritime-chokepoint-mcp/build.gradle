description = 'Global Maritime Chokepoint Risk, AIS Vessel Snapshot & Disruption Alerts MCP Tool PF4J plugin for Nadia.'

dependencies {
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
}

tasks.named('jar') {
    archiveBaseName = 'maritime-chokepoint-mcp'
    manifest {
        attributes(
            'Plugin-Id': 'maritime-chokepoint-mcp',
            'Plugin-Version': project.version.toString(),
            'Plugin-Provider': 'Miller Software Solutions LLC',
            'Plugin-Description': project.description,
            'Plugin-License': 'Apache-2.0',
            'Plugin-Class': 'com.nadia.plugin.maritime.MaritimeChokepointPlugin'
        )
    }
}
