plugins {
    id 'org.openjfx.javafxplugin'
}

description = 'Slack Socket Mode Bot, Automated System Alerting, Markdown-to-mrkdwn Converter, Agent Notification Tools, and Settings Tab PF4J plugin for Nadia.'

javafx {
    version = '23'
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web' ]
    configuration = 'compileOnly'
}

dependencies {
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    compileOnly 'org.commonmark:commonmark:0.24.0'
    compileOnly 'org.commonmark:commonmark-ext-gfm-strikethrough:0.24.0'
    compileOnly 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'
}

tasks.named('jar') {
    archiveBaseName = 'slack-integration'
    manifest {
        attributes(
            'Plugin-Id': 'slack-integration',
            'Plugin-Version': project.version.toString(),
            'Plugin-Provider': 'Miller Software Solutions LLC',
            'Plugin-Description': project.description,
            'Plugin-License': 'Apache-2.0',
            'Plugin-Class': 'com.nadia.plugin.slack.SlackIntegrationPlugin'
        )
    }
}

