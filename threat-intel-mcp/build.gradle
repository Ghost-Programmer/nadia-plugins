description = 'NIST NVD CVE, AbuseIPDB, AlienVault OTX & URLhaus Threat Intelligence MCP Tool PF4J plugin for Nadia.'

dependencies {
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
}

tasks.named('jar') {
    archiveBaseName = 'threat-intel-mcp'
    manifest {
        attributes(
            'Plugin-Id': 'threat-intel-mcp',
            'Plugin-Version': project.version.toString(),
            'Plugin-Provider': 'Miller Software Solutions LLC',
            'Plugin-Description': project.description,
            'Plugin-License': 'Apache-2.0',
            'Plugin-Class': 'com.nadia.plugin.threatintel.ThreatIntelPlugin'
        )
    }
}
